name: Site smoke check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/warm-field-manual]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check assets/toolkit.js
      - name: Site smoke checks
        run: node scripts/smoke-check.mjs
